<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ErgoScan · Watching the oracles</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0e0f14; color: #e8edf5;
      display: flex; flex-direction: column; align-items: center;
    }
    header { width: min(1100px, 100%); padding: 28px 20px 8px; }
    .mark { font-weight: 700; letter-spacing: .08em; font-size: 13px; }
    .mark span.ergo { color: #ff8a2a; }
    .mark span.scan { color: #3ad7ff; }
    .beta {
      display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; letter-spacing: .12em; color: #0e0f14; background: #3ad7ff;
    }
    h1 { font-size: 28px; font-weight: 600; margin: 10px 0 4px; }
    p.sub { color: #8b95a7; margin: 0 0 18px; }
    main { width: min(1100px, 100%); padding: 0 20px 40px; }
    video {
      width: 100%; border-radius: 16px; background: #000;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      border: 1px solid #1c2230;
    }
    footer { width: min(1100px,100%); padding: 8px 20px 36px; color: #6d7686; font-size: 12px; }
    a { color: #3ad7ff; }
  </style>
</head>
<body>
  <header>
    <div class="mark">[ <span class="ergo">ERGO</span> <span class="scan">SCAN ME</span> ] <span class="beta">BETA</span></div>
    <h1>Today I watch the oracles.</h1>
    <p class="sub">Kayolo · three feeds · live and silent operators</p>
  </header>
  <main>
    <video controls playsinline preload="metadata" src="./ergoscan-oracles.mp4"></video>
  </main>
  <footer>
    Music: Crypto by Kevin MacLeod (incompetech.com) · CC BY 3.0<br>
    Character and voice locked to ErgoScan Kayolo.
  </footer>
</body>
</html>
